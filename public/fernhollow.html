<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fernhollow</title>
<meta name="description" content="A regenerative design studio. Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#valley{position:fixed;inset:0}
#valley canvas{display:block;width:100%!important;height:100%!important}

/* Night valley fallback — radial gradient + animated canvas particles */
#valley::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(1200px 700px at 50% 85%, rgba(68,104,82,.55), transparent 60%),
    radial-gradient(900px 600px at 20% 70%, rgba(42,78,70,.35), transparent 70%),
    radial-gradient(900px 600px at 80% 70%, rgba(80,60,110,.35), transparent 70%),
    linear-gradient(180deg,#05070a 0%, #0a1210 55%, #0e1a16 100%);
}
#valley::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%);
  pointer-events:none;
}

.lil-gui{display:none!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.ui.on{opacity:1}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s}
.pill:hover{transform:translateY(-1px)}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow",sans-serif;letter-spacing:-.012em;white-space:nowrap}
.cap{margin-top:calc(48*var(--u));font-size:calc(20*var(--u));line-height:1.3}
.go{display:grid;place-items:center;margin-top:calc(34*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s}
.go:hover{background:var(--cream);color:#151510}
.go svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u))}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w{transition:opacity .3s}.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#000;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  .corner{left:20px;justify-content:center}
  h1{font-size:clamp(64px,19vw,96px);white-space:normal}
  .cap{font-size:17px}
  .corner{right:20px;bottom:30px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none}.flower{animation:none!important}}
</style>
</head>
<body>
<div id="valley" aria-hidden="true">
  <canvas id="valley-canvas"></canvas>
</div>
<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" aria-label="Fernhollow">Fernhollow</a>
    <nav aria-label="Main"><a href="#">Work</a><a href="#">About</a><a href="#">Journal</a><a class="pill" href="#">Let’s talk</a></nav>
  </header>
  <section class="hero">
    <h1>Grown, not built.</h1>
    <p class="cap">Rooted in nature.<br>Built for what’s next.</p>
    <a class="go" href="#" id="go" aria-label="See our work"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </section>
  <div class="corner"><span>Scroll to wander</span><i></i>
    <button class="sound" id="sound" aria-pressed="false" aria-label="Ambient sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>
  </div>
</div>
<div class="loader" id="loader"><span></span></div>

<script>
/* ------------------------------------------------------------------ */
/* Fallback night-valley: thousands of glowing point-sprite flowers.  */
/* The real page would load the gladeye.com compiled engine here;     */
/* this stand-in keeps the same interaction model: wheel/touch pushes */
/* the camera forward along the valley, mouse disperses nearby points */
/* outward, and hovering the arrow eases the drift to a halt.         */
/* ------------------------------------------------------------------ */
(function(){
  const canvas = document.getElementById('valley-canvas');
  const ctx = canvas.getContext('2d');
  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){
    W=innerWidth;H=innerHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize',resize);resize();

  // mouse (screen space push, like the real engine)
  const mouse={x:-9999,y:-9999,active:false};
  addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});
  addEventListener('pointerleave',()=>{mouse.active=false});

  // virtual scroller: wheel + touch move camera along the path
  let camZ=0,camTarget=0,drift=0.02;
  addEventListener('wheel',e=>{camTarget+=e.deltaY*0.0015;e.preventDefault();},{passive:false});
  let touchY=null;
  addEventListener('touchstart',e=>{touchY=e.touches[0].clientY});
  addEventListener('touchmove',e=>{
    if(touchY==null)return;
    const dy=touchY-e.touches[0].clientY;
    camTarget+=dy*0.02*20; // 20× touch multiplier per the brief
    touchY=e.touches[0].clientY;
  });

  // hover transition (arrow): ease flight to a stop, disperse points
  let hoverT=0; // 0..1
  const go=document.getElementById('go');
  go.addEventListener('pointerenter',()=>hoverTarget=1);
  go.addEventListener('pointerleave',()=>hoverTarget=0);
  let hoverTarget=0;

  // seed flowers
  const COUNT = Math.min(2400, Math.floor((W*H)/900));
  const flowers=[];
  const palette=[
    [255,244,214],   // cream
    [255,210,170],   // warm amber
    [255,180,200],   // pink
    [200,220,255],   // cool
    [180,255,210],   // mint
    [220,200,255],   // violet
  ];
  function rand(a,b){return a+Math.random()*(b-a)}
  for(let i=0;i<COUNT;i++){
    flowers.push({
      // position in a long valley strip, z increases into distance
      x: rand(-1.4, 1.4),
      y: rand(-0.35, 0.55),
      z: rand(0, 60),
      c: palette[(Math.random()*palette.length)|0],
      k: rand(0.6,1.4),             // size multiplier
      leaf: Math.random()<0.35,     // leaves vs flowers
      jx:0, jy:0                    // mouse displacement
    });
  }

  function project(p, camZ){
    // simple perspective: screen = (x / z) * focal + origin
    const z = p.z - camZ;
    if(z<=0.1) return null;
    const focal = 620;
    const sx = (p.x / z) * focal + W/2 + p.jx;
    const sy = (p.y / z) * focal + H*0.55 + p.jy;
    const scale = focal/z;
    return {sx,sy,scale,z};
  }

  let last=performance.now();
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;

    // ease hoverT
    hoverT += (hoverTarget - hoverT) * Math.min(1, dt*3);

    // idle drift forward + wheel/touch target (muted on hover)
    const driftActive = drift * (1 - hoverT);
    camZ += driftActive * 60 * dt;
    camZ += (camTarget - 0) * 0.8 * dt;
    camTarget *= Math.pow(0.001, dt); // decay the delta

    // clear with slight trail for bloom-ish glow
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';

    // iterate flowers
    for(let i=0;i<flowers.length;i++){
      const p=flowers[i];
      // recycle past the camera
      let z = p.z - camZ;
      if(z<=0.3){
        p.z += 60; // loop back into the distance
        p.x = rand(-1.4,1.4);
        p.y = rand(-0.35,0.55);
        z = p.z - camZ;
      }
      if(z>60) continue;

      const pr = project(p, camZ);
      if(!pr) continue;

      // mouse push (screen space), strongest when close
      let dx=0,dy=0,near=0;
      if(mouse.active){
        dx = pr.sx - mouse.x;
        dy = pr.sy - mouse.y;
        const d2 = dx*dx+dy*dy;
        const r = 220;
        if(d2 < r*r){
          const d=Math.sqrt(d2)||1;
          const k=(1 - d/r);
          near = k;
          p.jx += (dx/d)*k*4;
          p.jy += (dy/d)*k*4;
        }
      }
      // relax jitter
      p.jx *= 0.85; p.jy *= 0.85;

      // hover transition: disperse outward
      if(hoverT>0.01){
        const cx = pr.sx - W/2, cy = pr.sy - H/2;
        const dr = Math.hypot(cx,cy)||1;
        p.jx += (cx/dr)*hoverT*2.2;
        p.jy += (cy/dr)*hoverT*2.2;
      }

      // bloom scale: flowers bloom as they approach camera
      const bloom = Math.min(1, (60 - z)/40);
      const size = (p.leaf ? 2.2 : 3.4) * p.k * pr.scale * (0.2 + bloom*0.9);
      if(size<0.2) continue;

      const [r,g,b] = p.c;
      const alpha = Math.min(1, 0.18 + bloom*0.75) * (1 - hoverT*0.3);
      const glow = 0.4 + near*0.6;

      // glow halo
      ctx.beginPath();
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha*0.35*glow})`;
      ctx.arc(pr.sx, pr.sy, size*3, 0, Math.PI*2);
      ctx.fill();

      // core
      ctx.beginPath();
      ctx.fillStyle = p.leaf
        ? `rgba(${(r*0.6)|0},${(g*0.9)|0},${(b*0.6)|0},${alpha})`
        : `rgba(${r},${g},${b},${alpha})`;
      ctx.arc(pr.sx, pr.sy, size, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.globalCompositeOperation='source-over';

    // light-ray sprites + dust (very light touch)
    ctx.fillStyle='rgba(245,239,226,0.02)';
    ctx.fillRect(0,0,W,H);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---- loader fade + ui reveal (mimics the original onLoaded/onIntroDone) ---- */
  window.addEventListener('load',()=>{
    setTimeout(()=>document.getElementById('loader').classList.add('gone'), 350);
    setTimeout(()=>document.getElementById('ui').classList.add('on'), 650);
  });

  /* ---- sound toggle (visual-only in this fallback) ---- */
  const sound=document.getElementById('sound');
  sound.addEventListener('click',()=>{
    const on = sound.getAttribute('aria-pressed')==='true';
    sound.setAttribute('aria-pressed', String(!on));
  });
})();
</script>
</body>
</html>
